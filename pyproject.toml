[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pydiffuser"
description = "A python library for generating media with diffusion."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sam Ireland", email = "mail@samireland.com" }]
requires-python = ">=3.13"
keywords = ["diffusion", "clip", "torch", "image-generation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Graphics",
]
dynamic = ["version"]

# Lower bounds only - this is a library, so pinning here would make it
# uninstallable alongside anything else. Exact versions used in CI live in
# requirements.txt.
dependencies = [
    "click>=8.4",
    "safetensors>=0.8",
    "torch>=2.13",
    "transformers>=5.13",
]

[project.scripts]
pydiffuser = "pydiffuser.cli:cli"

[project.urls]
Homepage = "https://github.com/samirelanduk/pydiffuser"
Source = "https://github.com/samirelanduk/pydiffuser"
Issues = "https://github.com/samirelanduk/pydiffuser/issues"

[dependency-groups]
dev = ["black==25.1.0", "pre-commit==4.1.0"]

[tool.hatch.version]
path = "pydiffuser/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["pydiffuser"]

[tool.hatch.build.targets.sdist]
include = ["pydiffuser", "tests", "README.md", "LICENSE"]

[tool.black]
line-length = 88
target-version = ["py313"]
